<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Speech, symbols, and a checked action.</title>
  <desc id="heroDesc">A spoken instruction becomes a symbolic command. A deterministic gate checks it against the twin's state and procedure, then executes it or refuses it with a reason.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#e4e3dd" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx=".72" cy=".45" r=".55">
      <stop offset="0" stop-color="#e8a08f" stop-opacity=".10"/>
      <stop offset="1" stop-color="#e8a08f" stop-opacity="0"/>
    </radialGradient>
    <style>
      .kicker{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:11px;letter-spacing:2.2px;fill:#a9a79e;font-weight:600}
      .headline{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:42px;font-weight:700;letter-spacing:-1.4px;fill:#e4e3dd}
      .body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:12.5px;fill:#c9c7bd}
      .meta{font-family:Consolas,'SFMono-Regular',monospace;font-size:10px;fill:#d8d6cc}
      .step-title{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:12px;font-weight:600;fill:#e4e3dd}
      .step-sub{font-family:Consolas,'SFMono-Regular',monospace;font-size:9px;fill:#a9a79e}
      .brace{font-family:Consolas,'SFMono-Regular',monospace;font-size:15px;fill:#e8a08f}
      .bar{transform-box:fill-box;transform-origin:center;animation:wave 1.2s ease-in-out infinite}
      .cube{transform-box:fill-box;transform-origin:center;animation:cube 6s ease-in-out infinite}
      @keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1.25)}}
      @keyframes cube{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
      @media (prefers-reduced-motion: reduce){.bar,.cube{animation:none}}
    </style>
  </defs>

  <rect width="1000" height="320" fill="#15171a"/>
  <rect width="1000" height="320" fill="url(#grid)"/>
  <rect width="1000" height="320" fill="url(#glow)"/>

  <text class="kicker" x="48" y="58">NEURO-SYMBOLIC AI · 3D DIGITAL TWINS</text>
  <text class="headline" x="48" y="112">Speech, symbols,</text>
  <text class="headline" x="48" y="156"><tspan fill="#e8a08f">and a checked action.</tspan></text>

  <text class="body" x="48" y="196">
    <tspan x="48" dy="0">A spoken instruction becomes a symbolic command.</tspan>
    <tspan x="48" dy="19">The gate checks it against the twin's state and</tspan>
    <tspan x="48" dy="19">the procedure, then executes or refuses it.</tspan>
  </text>

  <circle cx="52" cy="272" r="3" fill="#6fbf8b"/>
  <text class="meta" x="64" y="275">A small evaluation of unsafe commands · code and results in the repository</text>

  <rect x="560" y="24" width="416" height="272" rx="12" fill="#101214" fill-opacity=".55" stroke="#2b2a26"/>
  <line x1="596" y1="54" x2="596" y2="250" stroke="#45443e" stroke-width="1"/>

  <!-- voice -->
  <rect x="580" y="38" width="32" height="32" rx="8" fill="#1d1f22" stroke="#4d4b45"/>
  <rect class="bar" x="588" y="52" width="2" height="8" rx="1" fill="#e8a08f"/>
  <rect class="bar" x="592" y="49" width="2" height="14" rx="1" fill="#e8a08f" style="animation-delay:-.15s"/>
  <rect class="bar" x="596" y="47" width="2" height="18" rx="1" fill="#e8a08f" style="animation-delay:-.3s"/>
  <rect class="bar" x="600" y="50" width="2" height="12" rx="1" fill="#e8a08f" style="animation-delay:-.45s"/>
  <rect class="bar" x="604" y="53" width="2" height="6" rx="1" fill="#e8a08f" style="animation-delay:-.6s"/>
  <text class="step-title" x="628" y="52">Voice</text>
  <text class="step-sub" x="628" y="68">“open the panel”</text>

  <!-- symbolic -->
  <rect x="580" y="98" width="32" height="32" rx="8" fill="#1d1f22" stroke="#4d4b45"/>
  <text class="brace" x="596" y="119" text-anchor="middle">{ }</text>
  <text class="step-title" x="628" y="112">Symbolic command</text>
  <text class="step-sub" x="628" y="128">open_panel(panel_04)</text>

  <!-- gate -->
  <rect x="580" y="158" width="32" height="32" rx="8" fill="#1d1f22" stroke="#3e6b52">
    <animate attributeName="stroke" values="#3e6b52;#8a4a3a;#3e6b52" dur="4s" repeatCount="indefinite"/>
  </rect>
  <path d="M587 174 l4 4 l7 -8" fill="none" stroke="#8fd3ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M609 165 l5 5 m0 -5 l-5 5" fill="none" stroke="#d47a67" stroke-width="1.6" stroke-linecap="round"/>
  <text class="step-title" x="628" y="172">Action gate</text>
  <text class="step-sub" x="628" y="188">twin state · procedure · intent</text>

  <!-- twin -->
  <rect x="580" y="218" width="32" height="32" rx="8" fill="#1d1f22" stroke="#4d4b45"/>
  <g class="cube">
    <path d="M596 222 L608 229 L608 243 L596 250 L584 243 L584 229 Z" fill="none" stroke="#e8a08f" stroke-width="1.2"/>
    <path d="M596 222 L596 236 L608 243 M596 236 L584 243" fill="none" stroke="#e8a08f" stroke-width="1.2" opacity=".7"/>
  </g>
  <text class="step-title" x="628" y="232">3D twin</text>
  <text class="step-sub" x="628" y="248">executes or refuses</text>

  <circle cx="596" cy="54" r="3" fill="#e8a08f">
    <animate attributeName="cy" values="54;250;54" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
